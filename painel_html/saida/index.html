<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel gerencial - Lastro Contábil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  /* paleta: fundo verde-petroleo quase preto, cartoes em petroleo, destaque em menta, texto branco */
  --plano:#061a1c; --sup:#0c2a2c; --sup2:#123a3b; --tinta:#f4fbfa; --tinta2:#a9c6c2; --mudo:#7a9a96; --linha:#1b4a49; --eixo:#2a6562;
  --marca:#34e0be; --marca2:#123a3b; --marca3:#1f6f66;
  --s1:#34e0be; --s2:#ff8a65; --s3:#7ff0dc; --s4:#f5c04a; --s5:#f78fb3; --s6:#e9f7f4; --s7:#9b8cf2;
  --ok:#34e0be; --alerta:#f5c04a; --critico:#ff6b5e; --okf:rgba(52,224,190,.10); --alertaf:rgba(245,192,74,.11); --criticof:rgba(255,107,94,.12);
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 85% -10%,#0f3a3a 0,transparent 60%),var(--plano);background-attachment:fixed;color:var(--tinta);font:15px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
h1,h2,h3,p{margin:0}button,select{font:inherit;color:inherit}
.topo{background:rgba(6,26,28,.85);border-bottom:1px solid var(--linha);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5}
.topo-in{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;cursor:pointer;background:none;border:0;padding:0;color:var(--tinta)}
.marca i{width:22px;height:22px;background:linear-gradient(160deg,#7ff0dc,#34e0be 55%,#1f9c88);border-radius:5px 5px 10px 10px;display:inline-block}
.marca small{font-weight:400;color:var(--tinta2);font-size:13px}
main{max-width:1280px;margin:0 auto;padding:20px 20px 60px}
.titulo{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.titulo h1{font-size:28px;font-weight:600;letter-spacing:-.2px;line-height:1.15}
.titulo p{color:var(--tinta2);margin-top:3px}
.voltar{border:1px solid var(--marca);background:transparent;color:var(--marca);font-weight:600;border-radius:8px;padding:7px 12px;cursor:pointer}
.voltar:focus-visible,.topo select:focus-visible,tr[tabindex]:focus-visible,.filtro button:focus-visible{outline:2px solid var(--marca);outline-offset:2px}
.linha{display:grid;gap:14px;margin-bottom:14px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.c6{grid-template-columns:repeat(6,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1080px){.c6{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:800px){.c2,.c32{grid-template-columns:minmax(0,1fr)}.c6{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cartao{background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:16px;min-width:0}
.cartao h2{font-size:16.5px;font-weight:600}
.cartao .sub{color:var(--tinta2);font-size:13.5px;margin:2px 0 12px}
.tile .rot{font-size:13px;color:var(--tinta2)}
.tile{border-top:3px solid var(--marca3)}
.tile .val{font-size:26px;font-weight:600;line-height:1.2;margin-top:2px;white-space:nowrap}
.tile .det{font-size:12.5px;color:var(--tinta2);margin-top:4px}
.neg{color:var(--critico)}
.sobe{color:var(--ok)}.desce{color:var(--critico)}
.pauta{display:grid;gap:8px}
.aviso{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:11px 14px;border-radius:8px;border-left:4px solid var(--alerta);background:var(--alertaf)}
.aviso.cr{border-left-color:var(--critico);background:var(--criticof)}
.aviso.ok{border-left-color:var(--ok);background:var(--okf)}
.aviso b{font-weight:600}.aviso .g{font-size:12px;font-weight:600;white-space:nowrap;grid-row:span 2;padding-top:2px}
.aviso.cr .g{color:var(--critico)}.aviso .g{color:var(--alerta)}.aviso.ok .g{color:var(--ok)}
.aviso p{color:var(--tinta);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.chip{border:1px solid currentColor}
.chip.cr{background:var(--criticof);color:var(--critico)}.chip.al{background:var(--alertaf);color:var(--alerta)}.chip.ok{background:var(--okf);color:var(--ok)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-weight:600;text-align:left;color:var(--tinta2);border-bottom:1px solid var(--eixo);padding:7px 12px 7px 0;white-space:nowrap;font-size:12.5px}
td{border-bottom:1px solid var(--linha);padding:7px 12px 7px 0;vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:600;border-bottom:1px solid var(--eixo)}
tr.clic{cursor:pointer}tr.clic:hover td{background:var(--sup2)}
td small{color:var(--mudo);display:block;font-size:12px}
.filtro{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filtro button{border:1px solid var(--eixo);background:var(--sup2);color:var(--tinta2);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13.5px}
.filtro button[aria-pressed=true]{background:var(--marca);color:#06201f;border-color:var(--marca);font-weight:600}
.cem{display:flex;gap:2px;height:30px;margin:6px 0 12px}
.cem div{border-radius:5px;color:#06201f;font-size:12.5px;font-weight:600;padding:6px 7px;white-space:nowrap;overflow:hidden;min-width:3px}
.leg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:5px 18px;font-size:13px;color:var(--tinta2)}
.leg span{display:flex;align-items:center;gap:7px}.leg i{width:10px;height:10px;border-radius:3px;flex:none}.leg b{color:var(--tinta);font-weight:600;margin-left:auto;font-variant-numeric:tabular-nums}
.legl{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--tinta2);margin-bottom:4px}
.legl span{display:inline-flex;align-items:center;gap:6px}.legl i{width:14px;height:3px;border-radius:2px;display:inline-block}
.faixas{position:relative;display:flex;gap:2px;height:26px;margin:22px 0 22px}
.faixas div{background:var(--sup2);border-radius:3px;position:relative;font-size:11.5px;color:var(--tinta2);padding:5px 6px;white-space:nowrap;overflow:hidden}
.faixas div.at{background:var(--marca);color:#06201f;font-weight:700}
.faixas u{position:absolute;top:-7px;bottom:-7px;width:3px;background:var(--tinta);border-radius:2px;text-decoration:none}
.faixas em{position:absolute;top:-24px;font-style:normal;font-size:12px;font-weight:600;transform:translateX(-50%);white-space:nowrap}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 14px;font-size:14px}.kv span{color:var(--tinta2)}.kv b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
svg{display:block;width:100%;overflow:visible}svg text{font-family:inherit;fill:var(--mudo);font-size:12px}
.dica{position:fixed;z-index:20;pointer-events:none;background:#e9f7f4;color:#06201f;padding:7px 10px;border-radius:6px;font-size:12.5px;line-height:1.45;max-width:260px}
.nota{font-size:12.5px;color:var(--mudo);margin-top:10px}
/* --- navegacao --- */
html{scroll-behavior:smooth}
.busca{display:flex;align-items:center;gap:10px;border:1px solid var(--eixo);background:var(--sup2);color:var(--tinta2);border-radius:9px;padding:7px 10px 7px 12px;cursor:pointer;min-width:260px;justify-content:space-between}
.busca:hover{border-color:var(--marca);color:var(--tinta)}
kbd{font-family:inherit;font-size:11.5px;font-weight:600;line-height:1;border:1px solid var(--eixo);border-bottom-width:2px;border-radius:5px;padding:3px 6px;color:var(--tinta2);background:var(--plano)}
dialog{border:1px solid var(--eixo);border-radius:14px;background:var(--sup);color:var(--tinta);padding:0;width:min(560px,calc(100vw - 32px));margin-top:12vh;box-shadow:0 24px 70px rgba(0,0,0,.55)}
dialog::backdrop{background:rgba(3,14,15,.6);backdrop-filter:blur(3px)}
dialog input{width:100%;border:0;border-bottom:1px solid var(--linha);background:none;color:var(--tinta);font:inherit;font-size:17px;padding:16px 18px;outline:none}
dialog ul{list-style:none;margin:0;padding:6px;max-height:min(52vh,430px);overflow:auto}
dialog li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;border-radius:9px;cursor:pointer}
dialog li small{color:var(--mudo);display:block;font-size:12.5px}
dialog li[aria-selected=true]{background:var(--sup2);box-shadow:inset 3px 0 0 var(--marca)}
dialog .pe{display:flex;gap:16px;padding:9px 16px;border-top:1px solid var(--linha);color:var(--mudo);font-size:12.5px}
.trilha{position:sticky;top:51px;z-index:4;margin:-20px -20px 18px;padding:0 20px;background:rgba(6,26,28,.88);backdrop-filter:blur(6px);border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:18px;justify-content:space-between;flex-wrap:wrap}
.trilha .onde{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mudo);white-space:nowrap}
.trilha .onde button{border:0;background:none;color:var(--marca);cursor:pointer;padding:12px 0;font-weight:600}
.trilha .onde button:hover{text-decoration:underline}
.secoes{position:relative;display:flex;gap:2px;overflow-x:auto}
.secoes a{color:var(--tinta2);text-decoration:none;padding:12px 12px 11px;font-size:14px;white-space:nowrap}
.secoes a:hover{color:var(--tinta)}.secoes a[aria-current=true]{color:var(--tinta);font-weight:600}
.secoes i{position:absolute;bottom:0;left:0;height:3px;width:40px;background:var(--marca);border-radius:3px 3px 0 0;transition:transform .28s cubic-bezier(.3,.7,.2,1),width .28s cubic-bezier(.3,.7,.2,1)}
.passo{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mudo)}
.passo button{border:1px solid var(--eixo);background:var(--sup2);color:var(--tinta);border-radius:8px;padding:5px 10px;cursor:pointer;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.passo button:hover:not(:disabled){border-color:var(--marca)}.passo button:disabled{opacity:.35;cursor:default}
.linha[id]{scroll-margin-top:112px}
.cab h1.nome{view-transition-name:nome-cliente}
.busca:focus-visible,.trilha button:focus-visible,.secoes a:focus-visible,dialog li:focus-visible{outline:2px solid var(--marca);outline-offset:2px}
/* transicao entre telas: a carteira recua, o cliente entra; anterior e proximo deslizam para o lado certo */
::view-transition-old(root),::view-transition-new(root){animation-duration:.26s;animation-timing-function:cubic-bezier(.3,.7,.2,1)}
::view-transition-group(nome-cliente){animation-duration:.34s;animation-timing-function:cubic-bezier(.3,.7,.2,1)}
@keyframes sai-esq{to{transform:translateX(-36px);opacity:0}}@keyframes entra-dir{from{transform:translateX(36px);opacity:0}}
@keyframes sai-dir{to{transform:translateX(36px);opacity:0}}@keyframes entra-esq{from{transform:translateX(-36px);opacity:0}}
@keyframes recua{to{transform:scale(.985);opacity:0}}@keyframes avanca{from{transform:scale(1.012);opacity:0}}
html[data-dir=prox]::view-transition-old(root){animation-name:sai-esq}html[data-dir=prox]::view-transition-new(root){animation-name:entra-dir}
html[data-dir=ant]::view-transition-old(root){animation-name:sai-dir}html[data-dir=ant]::view-transition-new(root){animation-name:entra-esq}
html[data-dir=abre]::view-transition-old(root){animation-name:recua}html[data-dir=abre]::view-transition-new(root){animation-name:avanca}
html[data-dir=fecha]::view-transition-old(root){animation-name:recua}html[data-dir=fecha]::view-transition-new(root){animation-name:avanca}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.secoes i{transition:none}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
@media (max-width:800px){.trilha{top:0;position:static}.busca{min-width:0}.busca span{display:none}}
.rodape{font-size:12.5px;color:var(--mudo);margin-top:26px}

/* ===== camada visual: vidro, brilho em menta, tipografia forte ===== */
:root{--titulo:"Sora","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--vidro:linear-gradient(180deg,rgba(22,66,66,.62),rgba(10,38,40,.72));--fio:rgba(52,224,190,.16)}
body{background:
  radial-gradient(900px 420px at 88% -8%,rgba(52,224,190,.16),transparent 62%),
  radial-gradient(700px 380px at -6% 18%,rgba(31,111,102,.28),transparent 60%),
  linear-gradient(rgba(52,224,190,.035) 1px,transparent 1px) 0 0/44px 44px,
  linear-gradient(90deg,rgba(52,224,190,.035) 1px,transparent 1px) 0 0/44px 44px,
  var(--plano);background-attachment:fixed}
h1,h2,.tile .val,.marca,.num{font-family:var(--titulo)}
.cartao{background:var(--vidro);border:1px solid var(--fio);border-radius:18px;padding:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 18px 40px -28px rgba(0,0,0,.8)}
.cartao h2{font-size:18px;font-weight:700;letter-spacing:-.2px}
.cartao .sub{margin-bottom:16px}
.linha{gap:16px;margin-bottom:16px}
/* heroi da carteira */
.heroi{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:center;padding:34px 36px;border-radius:24px;margin-bottom:16px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(26,84,80,.75),rgba(9,34,36,.85) 60%);border:1px solid rgba(52,224,190,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 30px 70px -40px rgba(52,224,190,.45)}
.heroi::after{content:"";position:absolute;right:-90px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(52,224,190,.22),transparent 65%);pointer-events:none}
.selo{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(52,224,190,.5);color:var(--marca);border-radius:99px;padding:5px 13px;font-size:12.5px;font-weight:600;background:rgba(52,224,190,.07)}
.selo i{width:7px;height:7px;border-radius:50%;background:var(--marca);box-shadow:0 0 0 4px rgba(52,224,190,.18)}
.heroi h1{font-size:clamp(30px,4.2vw,50px);font-weight:800;line-height:1.04;letter-spacing:-1.2px;margin:16px 0 12px;max-width:15ch}
.heroi p{color:var(--tinta2);font-size:16px;max-width:52ch}
.fatos{display:grid;grid-template-columns:repeat(4,auto);gap:10px 30px;margin-top:26px;justify-content:start}
.fatos div{border-left:2px solid var(--fio);padding-left:12px}
.fatos b{display:block;font-family:var(--titulo);font-size:24px;font-weight:700;line-height:1.1}
.fatos span{font-size:12.5px;color:var(--tinta2)}
.anel{position:relative;z-index:1;display:grid;justify-items:center;gap:14px}
.anel svg{width:min(250px,100%);overflow:visible;filter:drop-shadow(0 0 22px rgba(52,224,190,.25))}
.anel circle{fill:none;stroke-width:15;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.anel .tot{font-family:var(--titulo);font-size:52px;font-weight:800;fill:var(--tinta);letter-spacing:-2px}
.anel .rot{fill:var(--tinta2);font-size:13px}
.anel .leg-a{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--tinta2)}
.anel .leg-a span{display:inline-flex;align-items:center;gap:6px}.anel .leg-a i{width:9px;height:9px;border-radius:50%}
.anel .leg-a b{color:var(--tinta);font-family:var(--titulo)}
@media (prefers-reduced-motion:no-preference){.anel circle.seg{animation:desenha 1.1s cubic-bezier(.3,.7,.2,1) both}.anel circle.seg:nth-of-type(3){animation-delay:.12s}.anel circle.seg:nth-of-type(4){animation-delay:.24s}}
@keyframes desenha{from{stroke-dasharray:0 1000}}
/* pauta: um caso por cliente */
.caso{display:grid;grid-template-columns:230px minmax(0,1fr) auto;gap:6px 22px;align-items:center;padding:15px 18px 15px 20px;border-radius:14px;cursor:pointer;position:relative;
  background:linear-gradient(90deg,rgba(255,107,94,.11),rgba(255,107,94,.02) 55%);border:1px solid rgba(255,107,94,.22);transition:border-color .18s,transform .18s,background .18s}
.caso::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(var(--critico),#ff9b6b);box-shadow:0 0 14px rgba(255,107,94,.6)}
.caso:hover,.caso:focus-visible{border-color:rgba(255,107,94,.6);transform:translateX(3px);background:linear-gradient(90deg,rgba(255,107,94,.16),rgba(255,107,94,.04) 60%);outline:none}
.caso .quem b{display:block;font-family:var(--titulo);font-weight:700;font-size:15.5px}.caso .quem small{color:var(--mudo);font-size:12.5px}
.caso .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.caso .tags span{font-size:12px;font-weight:600;color:#ffc4bd;border:1px solid rgba(255,107,94,.4);border-radius:99px;padding:2px 9px;background:rgba(255,107,94,.08)}
.caso p{font-size:14px;color:var(--tinta2)}
.caso .vai{color:var(--mudo);font-size:13px;font-weight:600;white-space:nowrap;transition:color .18s,transform .18s}.caso:hover .vai{color:var(--tinta);transform:translateX(3px)}
@media (max-width:800px){.caso{grid-template-columns:minmax(0,1fr)}.caso .vai{display:none}.heroi{grid-template-columns:minmax(0,1fr);padding:24px 20px}.fatos{grid-template-columns:repeat(2,auto)}}
/* tabela e filtros */
th{font-size:12px;color:var(--mudo);border-bottom-color:var(--fio)}td{border-bottom-color:rgba(52,224,190,.08);padding-top:10px;padding-bottom:10px}
tr.clic td{transition:background .15s}tr.clic:hover td,tr.clic:focus-visible td{background:rgba(52,224,190,.07)}
tr.clic td:first-child{box-shadow:inset 3px 0 0 transparent;padding-left:10px;transition:box-shadow .15s}tr.clic:hover td:first-child{box-shadow:inset 3px 0 0 var(--marca)}
.filtro button{padding:5px 14px}
.chip{padding:3px 10px}
/* pagina do cliente */
.cab{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding:26px 30px;border-radius:22px;margin-bottom:16px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(26,84,80,.7),rgba(9,34,36,.85) 62%);border:1px solid rgba(52,224,190,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.cab::after{content:"";position:absolute;right:-70px;top:-130px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(52,224,190,.2),transparent 65%);pointer-events:none}
.cab h1{font-size:clamp(26px,3.4vw,40px);font-weight:800;letter-spacing:-.9px;line-height:1.08}
.cab .fichas{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.cab .fichas span{font-size:12.5px;color:var(--tinta2);border:1px solid var(--fio);border-radius:99px;padding:3px 11px;background:rgba(6,26,28,.4)}
.cab .estado{position:relative;z-index:1;text-align:right}.cab .estado .chip{font-size:14px;padding:6px 14px}
.cab .estado small{display:block;color:var(--tinta2);margin-top:7px;font-size:13px}
.tile{border-top:0;position:relative;overflow:hidden;padding:18px 18px 16px}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--marca),rgba(52,224,190,0))}
.tile.ruim::before{background:linear-gradient(90deg,var(--critico),rgba(255,107,94,0))}
.tile .val{font-size:28px;font-weight:700;letter-spacing:-.6px;margin-top:6px}
.tile .rot{font-size:13px}
.aviso{border-radius:12px;padding:14px 16px;border-left-width:0;position:relative;border:1px solid rgba(245,192,74,.25);background:linear-gradient(90deg,rgba(245,192,74,.12),rgba(245,192,74,.02) 60%)}
.aviso.cr{border-color:rgba(255,107,94,.28);background:linear-gradient(90deg,rgba(255,107,94,.13),rgba(255,107,94,.02) 60%)}

        <p>A carteira inteira numa tela: quem está em risco, por quê, e o que dizer a cada um. Os alertas já vêm escritos em linguagem de dono de empresa.</p>
        <div class="fatos"><div><b>${na}</b><span>para acompanhar</span></div><div><b>${nd}</b><span>em dia</span></div>
          <div><b>${atr}</b><span>${atr === 1 ? "balancete atrasado" : "balancetes atrasados"}</span></div><div><b>${brl(fat)}</b><span>faturados pelos clientes em 12 meses</span></div></div></div>
      <div class="anel">${anel}<div class="leg-a"><span><i style="background:var(--critico)"></i>Crítico <b>${nc}</b></span><span><i style="background:var(--alerta)"></i>Atenção <b>${na}</b></span><span><i style="background:var(--ok)"></i>Em dia <b>${nd}</b></span></div></div>
    </section>
    <div class="linha">${cartao("Pauta da semana", "Um caso por cliente crítico, com o primeiro ponto a tratar. Clique para abrir o painel dele.",
      `<div class="pauta">${pauta.map(p => `<div class="caso" data-cod="${p.c.cod}" tabindex="0"><div class="quem"><b>${esc(p.c.nome)}</b><small>${esc(p.c.atividade)}</small></div>
        <div><div class="tags">${p.a.map(a => `<span>${esc(a.titulo)}</span>`).join("")}</div><p>${esc(p.a[0].texto)}</p></div><span class="vai">Abrir painel</span></div>`).join("")}</div>`)}</div>
    <div class="linha">${cartao("Todos os clientes", "Faturamento e margem dos últimos 12 meses; a linha mostra o lucro mês a mês.",
      `<div class="filtro" id="f-sit">${bot(["Todas", "Crítico", "Atenção", "Em dia"], S.sit, "sit")}</div><div class="filtro" id="f-resp">${bot(resps, S.resp, "resp")}</div>
       <div class="tw"><table><thead><tr><th>Situação</th><th>Cliente</th><th>Regime</th><th class="n">Faturamento 12 m</th><th class="n">Margem líquida</th><th class="n">Liquidez</th><th>Lucro, 12 meses</th><th>Principal alerta</th><th class="n">Último balancete</th><th>Responsável</th></tr></thead><tbody>${linhasT}</tbody></table></div>`)}</div>
    <p class="rodape">Demonstração com dados 100% fictícios. Regras de imposto simplificadas: não usar como base fiscal.</p>`;
}

/* ---------------- cliente ---------------- */
function cliente(c) {
  const s = c.s, m = c.meses, n = m.length, U = k => ult(s[k]), P = (k, d) => s[k][n - 1 - d];
  const avisos = c.alertas.length ? c.alertas.map(a => `<div class="aviso ${a.g === "Crítico" ? "cr" : ""}"><span class="g">${a.g === "Crítico" ? "✕ Crítico" : "! Atenção"}</span><b>${esc(a.titulo)}</b><p>${esc(a.texto)}</p></div>`).join("")
    : `<div class="aviso ok"><span class="g">✓ Em dia</span><b>Nenhum ponto de atenção neste balancete</b><p>Resultado, caixa, dívida e impostos estão dentro do esperado.</p></div>`;
  const tile = (rot, val, det, neg) => `<div class="cartao tile ${neg ? "ruim" : ""}"><div class="rot">${rot}</div><div class="val ${neg ? "neg" : ""}">${val}</div><div class="det">${det}</div></div>`;
  const tiles = [
    tile("Faturamento do mês", brl(U("RECEITA_BRUTA")), varia(U("RECEITA_BRUTA"), P("RECEITA_BRUTA", 12), "um ano antes") || varia(U("RECEITA_BRUTA"), P("RECEITA_BRUTA", 1), m[n - 2] || "")),
    tile(U("LUCRO_LIQUIDO") < 0 ? "Prejuízo do mês" : "Lucro do mês", brl(U("LUCRO_LIQUIDO")), `${brl(soma(s.LUCRO_LIQUIDO, 3))} no trimestre`, U("LUCRO_LIQUIDO") < 0),
    tile("Sobra de cada R$ 100", "R$ " + nf(U("MARGEM_LIQUIDA_3M") * 100, 1), "margem líquida do trimestre", U("MARGEM_LIQUIDA_3M") < 0),
    tile("Dinheiro disponível", brl(U("DISPONIVEL")), `cobre ${nf(U("FOLEGO_CAIXA_MESES") * 30, 0)} dias de despesas`),
    tile("Para cada R$ 1 a pagar", "R$ " + nf(U("LIQUIDEZ_CORRENTE"), 2), "em caixa, a receber e estoque", U("LIQUIDEZ_CORRENTE") < 1),
    tile("Impostos", pct(U("CARGA_TRIBUTARIA")), "do faturamento do mês"),
  ].join("");
  // para onde vai cada R$ 100 (ultimo trimestre)
  const rb = soma(s.RECEITA_BRUTA, 3), partes = [
    ["Impostos e devoluções", -(soma(s.DEDUCOES, 3) + soma(s.IMPOSTO_LUCRO, 3)), "var(--s7)"], ["Mercadoria e serviço", -soma(s.CUSTOS, 3), "var(--marca3)"],
    ["Pessoal", -soma(s.DESPESAS_PESSOAL, 3), "var(--s2)"], ["Despesas administrativas", -(soma(s.DESPESAS_ADMINISTRATIVAS, 3) + soma(s.DEPRECIACAO, 3)), "var(--s4)"],
    ["Juros e tarifas", -soma(s.RESULTADO_FINANCEIRO, 3), "var(--s5)"]].filter(p => p[1] > 0);
  const lucro = soma(s.LUCRO_LIQUIDO, 3), saidas = partes.reduce((a, p) => a + p[1], 0);
  if (lucro > 0) partes.push(["Lucro", lucro, "var(--s1)"]);
  const base = Math.max(rb, saidas);
  const cem = `<div class="cem" role="img" aria-label="Divisão de cada R$ 100 de faturamento">${partes.map(p => `<div style="flex:${p[1]} 0 0;background:${p[2]};${["var(--s7)", "var(--s2)", "var(--marca3)"].includes(p[2]) ? "color:#fff" : ""}" data-dica="<b>${p[0]}</b><br>R$ ${nf(p[1] / rb * 100, 1)} de cada R$ 100<br>${brlc(p[1])} no trimestre">${p[1] / base > .07 ? nf(p[1] / rb * 100, 0) : ""}</div>`).join("")}</div>
    <div class="leg">${partes.map(p => `<span><i style="background:${p[2]}"></i>${p[0]}<b>R$ ${nf(p[1] / rb * 100, 1)}</b></span>`).join("")}</div>
    ${lucro < 0 ? `<p class="nota" style="color:var(--critico)">Saíram R$ ${nf(saidas / rb * 100, 1)} para cada R$ 100 que entraram: faltaram R$ ${nf(-lucro / rb * 100, 1)}.</p>` : ""}`;
  // DRE
  const L = [["Receita bruta", "RECEITA_BRUTA"], ["(-) Impostos e devoluções", "DEDUCOES"], ["Receita líquida", "RECEITA_LIQUIDA", 1], ["(-) Custo da mercadoria e do serviço", "CUSTOS"],
    ["Lucro bruto", "LUCRO_BRUTO", 1], ["(-) Pessoal", "DESPESAS_PESSOAL"], ["(-) Despesas administrativas", "DESPESAS_ADMINISTRATIVAS"], ["(-) Depreciação", "DEPRECIACAO"],
    ["Resultado operacional", "RESULTADO_OPERACIONAL", 1], ["Resultado financeiro", "RESULTADO_FINANCEIRO"], ["(-) IRPJ e CSLL", "IMPOSTO_LUCRO"], ["Lucro líquido", "LUCRO_LIQUIDO", 1]];
  const cel = v => `<td class="n ${v < 0 ? "neg" : ""}">${v == null ? "–" : nf(v, 0)}</td>`;
  const dre = `<div class="tw"><table><thead><tr><th>Em reais</th><th class="n">${m[n - 1]}</th><th class="n">${m[n - 2] || ""}</th><th class="n">${n > 12 ? m[n - 13] : "um ano antes"}</th><th class="n">12 meses</th></tr></thead><tbody>${
    L.map(([r, k, t]) => `<tr class="${t ? "tot" : ""}"><td>${r}</td>${cel(P(k, 0))}${cel(n > 1 ? P(k, 1) : null)}${cel(n > 12 ? P(k, 12) : null)}${cel(soma(s[k], 12))}</tr>`).join("")}</tbody></table></div>`;
  // Simples
  let fiscal;
  if (c.simples) { const x = c.simples, fx = D.faixas[x.anexo], teto = ult(fx)[0], pos = Math.min(100, x.rbt12 / teto * 100);
    fiscal = cartao("Simples Nacional", `Anexo ${x.anexo}. A faixa depende do faturamento dos últimos 12 meses${x.rbt12_proporcional ? " (empresa com menos de 12 meses: valor proporcional)" : ""}.`,
      `<div class="faixas">${fx.map((f, i) => `<div class="${i + 1 === x.faixa ? "at" : ""}" style="flex:${f[0] - (i ? fx[i - 1][0] : 0)} 0 0" data-dica="<b>Faixa ${i + 1}</b><br>até ${brlc(f[0])}<br>alíquota nominal ${pct(f[1])}">${i + 1}</div>`).join("")}<u style="left:calc(${pos}% - 1px)"></u><em style="left:${Math.max(8, Math.min(92, pos))}%">${brl(x.rbt12)}</em></div>
       <div class="kv"><span>Faixa atual</span><b>${x.faixa} de ${fx.length}</b><span>Alíquota efetiva</span><b>${pct(x.aliquota_efetiva)}</b>
       <span>Falta para subir de faixa</span><b>${x.folga_faixa == null ? "–" : brlc(x.folga_faixa)}</b><span>Falta para o limite do Simples</span><b>${brlc(x.limite_simples - x.rbt12)}</b>
       <span>Faturamento de 12 meses projetado para daqui a 3 meses</span><b>${brl(x.rbt12_projetado)}</b></div>
       <p class="nota">Tabela simplificada para a demonstração. Conferir com a legislação vigente.</p>`);
  } else fiscal = cartao("Impostos sobre o faturamento", `${esc(c.regime)}. Percentual do faturamento que vai em tributos, mês a mês.`,
      linhas("g-carga", m, [{n: "Carga tributária", c: "var(--s7)", v: s.CARGA_TRIBUTARIA.map(v => v == null ? null : v * 100)}], {fmt: v => nf(v, 0) + "%", un: "num", alt: 200}));
  const pos = D.clientes.indexOf(c), ant = D.clientes[pos - 1], prox = D.clientes[pos + 1];
  return `<nav class="trilha" aria-label="Navegação do cliente">
      <div class="onde"><button type="button" id="voltar">Carteira</button><span aria-hidden="true">/</span><span>${esc(c.nome)}</span></div>
      <div class="secoes" id="secoes"><a href="#sec-alertas">O que conversar</a><a href="#sec-resultado">Resultado</a><a href="#sec-dre">Demonstração e impostos</a><a href="#sec-caixa">Caixa e prazos</a><i aria-hidden="true"></i></div>
      <div class="passo"><span>${pos + 1} de ${D.clientes.length}</span>
        <button type="button" data-passo="${ant ? ant.cod : ""}" data-dir="ant" ${ant ? "" : "disabled"} title="${ant ? "Anterior: " + esc(ant.nome) + " (seta para a esquerda)" : ""}">‹ ${ant ? esc(ant.nome) : "Início"}</button>
        <button type="button" data-passo="${prox ? prox.cod : ""}" data-dir="prox" ${prox ? "" : "disabled"} title="${prox ? "Próximo: " + esc(prox.nome) + " (seta para a direita)" : ""}">${prox ? esc(prox.nome) : "Fim"} ›</button></div>
    </nav>
    <header class="cab"><div style="position:relative;z-index:1"><h1 class="nome">${esc(c.nome)}</h1>
        <div class="fichas"><span>${esc(c.atividade)}</span><span>${esc(c.cidade)}</span><span>${esc(c.regime)}${c.anexo ? ", Anexo " + c.anexo : ""}</span><span>Balancete de ${c.ultimo}</span></div></div>
      <div class="estado">${chip(c.situacao)}<small>${c.alertas.length ? c.alertas.length + (c.alertas.length > 1 ? " pontos para conversar" : " ponto para conversar") : "nenhum ponto de atenção"}</small></div></header>
    <div class="linha" id="sec-alertas">${cartao("O que conversar com o cliente", "Os pontos que este balancete levanta, em linguagem de dono de empresa.", `<div class="pauta">${avisos}</div>`)}</div>
    <div class="linha c6">${tiles}</div>
    <div class="linha c32" id="sec-resultado">${cartao("Faturamento e lucro, mês a mês", "O que entrou e o que sobrou em cada mês.", linhas("g-res", m, [{n: "Faturamento", c: "var(--s1)", v: s.RECEITA_BRUTA}, {n: "Lucro líquido", c: "var(--s6)", v: s.LUCRO_LIQUIDO}], {titulo: "Faturamento e lucro", area: true, alt: 260}))}
      ${cartao("Para onde vai cada R$ 100 que entram", "Média do último trimestre.", cem)}</div>
    <div class="linha c32" id="sec-dre">${cartao("Resultado do mês", "A demonstração de resultado resumida, comparada com o mês anterior e com um ano antes.", dre)}${fiscal}</div>
    <div class="linha c2" id="sec-caixa">${cartao("Caixa e dívida", "Dinheiro disponível (caixa e aplicações) contra a dívida com bancos.", linhas("g-cx", m, [{n: "Disponível", c: "var(--s1)", v: s.DISPONIVEL}, {n: "Dívida bancária", c: "var(--s2)", v: s.DIVIDA_BANCARIA}], {titulo: "Caixa e dívida", area: true}))}
      ${cartao("Prazo para receber e estoque", "Em dias: quanto tempo o dinheiro fica na rua e na prateleira.", linhas("g-pr", m, [{n: "Prazo de recebimento", c: "var(--s1)", v: s.PRAZO_RECEBIMENTO_DIAS}, {n: "Dias de estoque", c: "var(--s4)", v: s.DIAS_ESTOQUE.map(v => v > 400 ? null : v)}], {fmt: v => nf(v, 0), un: "dias", titulo: "Prazos"}))}</div>
    <p class="rodape">Responsável no escritório: ${esc(c.resp)} · CNPJ fictício ${esc(c.cnpj)} · Demonstração com dados 100% fictícios. Regras de imposto simplificadas.</p>`;
}

function render() {
  graficos = [];
  const c = CLI[S.cliente];
  try { $("#app").innerHTML = c ? cliente(c) : carteira(); desenhar(); } catch (e) { $("#app").innerHTML = `<pre style="color:#ff6b5e;white-space:pre-wrap">${esc(e.stack || e)}</pre>`; }
  document.title = (c ? c.nome + " - " : "") + "Painel gerencial - " + D.escritorio;
  espiar();
}

/* Troca de tela com animacao (View Transitions): o nome do cliente "viaja" da linha da tabela para o titulo.
   Sem suporte no navegador, ou com "reduzir movimento" ligado, a troca e direta. */
const calmo = matchMedia("(prefers-reduced-motion: reduce)");
function ir(cod, o = {}) {
  cod = cod || null;
  if (cod === S.cliente && !o.forcar) return;
  const de = S.cliente, dir = o.dir || (cod ? (de ? "prox" : "abre") : "fecha");
  if (!de) S.rolagem = scrollY;                                        // guarda onde a carteira estava
  const alvo = !cod && de;                                             // voltando: o titulo pousa de volta na linha
  if (cod && !de) { const b = document.querySelector(`tr[data-cod="${cod}"] b`); if (b) b.style.viewTransitionName = "nome-cliente"; }
  S.cliente = cod; S.morfa = alvo || null;                             // o estado muda na hora; a tela so desenha o estado atual
  let feito = false;
  const troca = () => { feito = true; render(); scrollTo({top: S.cliente ? 0 : (S.rolagem || 0), behavior: "instant"}); };
  if (o.historico !== false) history.pushState(null, "", cod ? "#cliente=" + cod : location.pathname + location.search);
  if (!document.startViewTransition || calmo.matches || document.visibilityState !== "visible") return troca();
  document.documentElement.dataset.dir = dir;
  const vt = document.startViewTransition(troca);
  setTimeout(() => { if (!feito) { vt.skipTransition(); troca(); } }, 500);   // aba sem quadros: a tela nao pode ficar para tras do endereco
  vt.finished.finally(() => {
    S.morfa = null; document.querySelectorAll("tr[data-cod] b").forEach(b => b.style.viewTransitionName = "");
  });
}

/* Secao visivel: o marcador desliza para o link da secao que esta na tela */
let observador;
function espiar() {
  if (observador) observador.disconnect();
  const nav = $("#secoes"); if (!nav) return;
  const links = [...nav.querySelectorAll("a")], barra = nav.querySelector("i");
  const marca = a => { links.forEach(l => l.setAttribute("aria-current", l === a)); barra.style.width = a.offsetWidth - 24 + "px"; barra.style.transform = `translateX(${a.offsetLeft + 12}px)`; };
  marca(links[0]);
  observador = new IntersectionObserver(es => { const v = es.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
    if (v) marca(links.find(l => l.getAttribute("href") === "#" + v.target.id)); }, {rootMargin: "-120px 0px -55% 0px"});
  links.forEach(l => { const alvo = document.getElementById(l.getAttribute("href").slice(1)); if (alvo) observador.observe(alvo);
    l.onclick = ev => { ev.preventDefault(); alvo.scrollIntoView({behavior: calmo.matches ? "auto" : "smooth", block: "start"}); }; });
}

/* Busca rapida (Ctrl K ou /): digitar, setas, Enter */
const paleta = $("#paleta"), campo = $("#q"), lista = $("#lista");
let achados = [], sel = 0;
const semAcento = t => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function listar() {
  const t = semAcento(campo.value.trim());
  achados = [{cod: "", nome: "Carteira de clientes", sub: "Todos os clientes do escritório"}, ...D.clientes.map(c => ({cod: c.cod, nome: c.nome, sub: c.atividade + ", " + c.cidade, sit: c.situacao}))]
    .filter(x => !t || semAcento(x.nome + " " + x.sub).includes(t));
  sel = Math.min(sel, Math.max(0, achados.length - 1));
  lista.innerHTML = achados.length ? achados.map((x, i) => `<li role="option" aria-selected="${i === sel}" data-i="${i}"><span>${esc(x.nome)}<small>${esc(x.sub)}</small></span>${x.sit ? chip(x.sit) : ""}</li>`).join("")
    : `<li style="cursor:default;color:var(--mudo)">Nenhum cliente com esse nome. Tente a atividade ou a cidade.</li>`;
  const li = lista.querySelector('[aria-selected="true"]'); if (li) li.scrollIntoView({block: "nearest"});
}
function abrirBusca() { campo.value = ""; sel = 0; listar(); paleta.showModal(); campo.focus(); }
function escolher(i) { const x = achados[i]; if (!x) return; paleta.close(); ir(x.cod, {dir: x.cod ? (S.cliente ? "prox" : "abre") : "fecha"}); }
campo.oninput = () => { sel = 0; listar(); };
campo.onkeydown = ev => { if (ev.key === "ArrowDown") { sel = Math.min(sel + 1, achados.length - 1); listar(); ev.preventDefault(); }
  else if (ev.key === "ArrowUp") { sel = Math.max(sel - 1, 0); listar(); ev.preventDefault(); } else if (ev.key === "Enter") { escolher(sel); ev.preventDefault(); } };
lista.onclick = ev => { const li = ev.target.closest("li[data-i]"); if (li) escolher(+li.dataset.i); };
paleta.onclick = ev => { if (ev.target === paleta) paleta.close(); };
$("#abre-busca").onclick = abrirBusca;

$("#home").onclick = () => ir(null);
$("#app").addEventListener("click", ev => { const t = ev.target;
  const p = t.closest("button[data-passo]"); if (p) return p.dataset.passo && ir(p.dataset.passo, {dir: p.dataset.dir});
  if (t.closest("#voltar")) return ir(null);
  const el = t.closest("[data-cod]"); if (el) return ir(el.dataset.cod);
  const b = t.closest("button[data-sit],button[data-resp]"); if (b) { if (b.dataset.sit) S.sit = b.dataset.sit; else S.resp = b.dataset.resp; render(); } });
document.addEventListener("keydown", ev => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "k") { ev.preventDefault(); return paleta.open ? paleta.close() : abrirBusca(); }
  const alvo = ev.target.closest ? ev.target : document.body;
  if (paleta.open || alvo.closest("input,textarea,select") || ev.altKey || ev.ctrlKey || ev.metaKey) return;
  if (ev.key === "/") { ev.preventDefault(); return abrirBusca(); }
  if (ev.key === "Enter") { const el = alvo.closest("[data-cod]"); if (el) return ir(el.dataset.cod); }
  const c = CLI[S.cliente]; if (!c) return;
  const pos = D.clientes.indexOf(c);
  if (ev.key === "ArrowRight" && D.clientes[pos + 1]) ir(D.clientes[pos + 1].cod, {dir: "prox"});
  if (ev.key === "ArrowLeft" && D.clientes[pos - 1]) ir(D.clientes[pos - 1].cod, {dir: "ant"});
});
/* Voltar e avancar do navegador funcionam: cada cliente aberto e uma entrada no historico */
const daUrl = () => { const h = new URLSearchParams(location.hash.slice(1)).get("cliente"); return CLI[h] ? h : null; };
addEventListener("popstate", () => ir(daUrl(), {historico: false, dir: daUrl() ? "abre" : "fecha"}));
S.cliente = daUrl();
let tr; addEventListener("resize", () => { clearTimeout(tr); tr = setTimeout(() => { desenhar(); espiar(); }, 120); });
render();
</script>
</body>
